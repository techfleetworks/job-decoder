name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Architecture gate (domain purity + I/O ownership)
        run: npm run check:architecture
      - name: Type-check and build
        run: npm run build
      - name: Tests
        run: npm run test:run
