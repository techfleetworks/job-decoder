name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Architecture gate (tier boundaries + domain purity)
        run: npm run check:architecture
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test:run
      - name: Gherkin is valid
        run: npm run check:gherkin
      - name: BDD tags are complete and in-vocabulary
        run: npm run check:bdd-tags
      - name: BDD coverage (matrix, datastore, log)
        run: npm run check:bdd-coverage
      - name: BDD scenarios run (strict)
        run: npm run test:bdd
      - name: BDD scenarios all executed and passed
        run: npm run check:bdd-executed
      - name: Snapshot integrity (build the read model from local framework data)
        run: npm run check:snapshot-integrity
      - name: Dependency scan (production high/critical advisories)
        run: npm run check:dependencies
      - name: Build
        run: npm run build
